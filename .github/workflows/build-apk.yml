name: Build Android APK (Prodaily)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Release & Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm install

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 🔄 Sync Capacitor Web Assets
        run: npx cap sync android

      - name: 🔨 Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📦 Rename APK for Release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Prodaily-v1.0.3.apk

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Prodaily-v1.0.3.apk
          path: Prodaily-v1.0.3.apk
          retention-days: 30

      - name: 📢 Auto Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: Prodaily v1.0.3 - 100% Serverless & Standalone Mobile Edition
          body: |
            📱 **Prodaily v1.0.3 - Bản dựng Độc Lập 100% (Serverless Mobile Edition)**

            🌟 **Nâng cấp đột phá:**
            - 🚀 **100% Độc Lập Không Cần Máy Chủ:** Loại bỏ hoàn toàn sự phụ thuộc vào server máy tính/localhost. Ứng dụng chạy trực tiếp trên điện thoại qua mạng 4G/Wifi.
            - 🔒 **Kết nối trực tiếp Riot Games API:** Xác thực OAuth, tải Cửa Hàng, Kho Đồ, Chợ Đêm, Ví VP/Radianite trực tiếp từ máy chủ Riot và valorant-api.com.
            - 📋 **Đăng nhập tiện lợi:** Bổ sung nút sao chép link xác thực Riot nhanh chóng để người dùng mở trên bất kỳ trình duyệt nào.
            - ⚡ **Peek Tướng & Khóa Tướng Live:** Nhận diện trận đấu thời gian thực qua Riot GLZ Gateway, hiển thị bản đồ, đội hình 5 người và hỗ trợ khóa tướng từ xa.
            - 🔊 **Âm thanh Video 1080p:** Đầy đủ tiếng hoạt ảnh và nút bật/tắt âm thanh tiện lợi.

            👤 Tác giả: **merrthereboy**  
            💬 Cộng đồng Discord: https://discord.com/invite/z4jUC4v8W2
          files: Prodaily-v1.0.3.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
