name: Build Android APK (Prodaily)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Release & Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm install

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 🔄 Sync Capacitor Web Assets
        run: npx cap sync android

      - name: 🔨 Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📦 Rename APK for Release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Prodaily-v1.0.4.apk

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Prodaily-v1.0.4.apk
          path: Prodaily-v1.0.4.apk
          retention-days: 30

      - name: 📢 Auto Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4
          name: Prodaily v1.0.4 - Fix Nạp VP, Tra Skin Tiếng Việt & Mượt Mà
          body: |
            📱 **Prodaily v1.0.4 - Cập nhật hoàn thiện trải nghiệm Mobile**

            🌟 **Chi tiết bản sửa lỗi & tối ưu:**
            - 💰 **Sửa triệt để lỗi tính tiền nạp VP / VNĐ:**
              - Loại bỏ hoàn toàn 18 vũ khí mặc định (Standard skins) vốn bị tính nhầm 18.425 VP (~2.800.000 VNĐ) vào số tiền nạp.
              - Phân loại chuẩn xác toàn bộ 463 skin Battle Pass từ 40 Season: tính đúng 1.000 VP / Vé Act thay vì nhân lẻ từng skin.
              - Miễn phí toàn bộ súng nhiệm vụ Đặc Vụ (29 súng đặc vụ, 0 VP).
              - Bổ sung nút **✏️ Tùy chỉnh tiền nạp** cho phép người dùng xem chi tiết bảng phân loại VP hoặc tự nhập số tiền nạp thực tế.
            - 🔍 **Hỗ trợ tìm kiếm Skin Tiếng Việt hoàn hảo:**
              - Tải song ngữ `vi-VN` & `en-US` từ valorant-api. Tra cứu tức thì từ khóa Tiếng Việt có dấu ("lưỡi hái", "kẻ cướp", "chiến hồn", "hoàng hôn") hoặc không dấu ("luoi hai", "ke cuop") lẫn tên tiếng Anh ("scythe", "reaver", "karambit").
            - 📜 **Sửa lỗi danh sách gợi ý tìm kiếm bị cụt ngủn & không cuộn được:**
              - Chuyển danh sách gợi ý thành dạng in-flow mượt mà, mở rộng tới 360px với momentum touch scroll (`-webkit-overflow-scrolling: touch`).
              - Hiển thị cả tên Tiếng Việt và phụ đề tiếng Anh, giá VP, nút ▶ Xem hoạt ảnh và nút ⭐ Hẹn skin trực tiếp.

            👤 Tác giả: **merrthereboy**  
            💬 Cộng đồng Discord: https://discord.com/invite/z4jUC4v8W2
          files: Prodaily-v1.0.4.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
