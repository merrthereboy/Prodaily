name: Build Android APK (Prodaily)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Release & Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm install

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 🔄 Sync Capacitor Web Assets
        run: npx cap sync android

      - name: 🔨 Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📦 Rename APK for Release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Prodaily-v1.0.1.apk

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Prodaily-v1.0.1.apk
          path: Prodaily-v1.0.1.apk
          retention-days: 30

      - name: 📢 Auto Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: Prodaily v1.0.1 - Standalone Mobile Edition
          body: |
            📱 **Prodaily v1.0.1 - Bản cập nhật Độc Lập 100% cho Android (Không cần máy tính)**

            🌟 **Thay đổi & Nâng cấp quan trọng:**
            - 🚀 **100% Standalone Mobile:** Ứng dụng chạy trực tiếp trên điện thoại, tự động kết nối Riot Games API thông qua Android Native HTTP (CapacitorHttp). Không cần bật máy tính hay chạy server!
            - 📶 **Hỗ trợ 4G/5G & Mọi mạng Wi-Fi:** Khắc phục triệt để lỗi "Lỗi kết nối máy chủ" và lỗi bảo mật Mixed Content trên Android.
            - 💾 **Cache tức thì:** Lưu phiên đăng nhập an toàn trong máy, mở app tải ngay 0 giây.

            ✨ **Tính năng đầy đủ:**
            - 🛒 **Xem Shop & Chợ Đêm:** Xem 4 skin hàng ngày, video skin, nâng cấp cấp độ & biến thể màu.
            - 🎒 **Kho Đồ & Thư Viện Skin:** Tra cứu toàn bộ skin súng, dao, thẻ bài và kho đồ cá nhân.
            - ⚡ **Pick & Khóa Tướng Từ Xa (Remote Instalock):** Tự động nhận diện map và khóa đặc vụ ưu tiên.
            - 💎 **Định Giá Tài Khoản Chuẩn Mezu:** Tính chi tiết số tiền đã nạp theo bảng giá nạp ZaloPay chính hãng.
            - 🛡️ **Tiện Ích:** Chế độ ẩn số dư ví, đổi ngôn ngữ Việt - Anh, hẹn skin yêu thích.

            👤 Tác giả: **merrthereboy**  
            💬 Cộng đồng Discord: https://discord.com/invite/z4jUC4v8W2
          files: Prodaily-v1.0.1.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
