name: Build Android APK (Prodaily)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Release & Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm install

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 🔄 Sync Capacitor Web Assets
        run: npx cap sync android

      - name: 🔨 Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📦 Rename APK for Release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Prodaily-v1.0.2.apk

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Prodaily-v1.0.2.apk
          path: Prodaily-v1.0.2.apk
          retention-days: 30

      - name: 📢 Auto Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: Prodaily v1.0.2 - Audio, Real Push Alerts & Live Match Auto-Lock
          body: |
            📱 **Prodaily v1.0.2 - Bản cập nhật lớn hoàn thiện tính năng & trải nghiệm người dùng**

            🌟 **Các sửa đổi & nâng cấp nổi bật:**
            - 🎨 **Logo & Tên App Chính Thức:** Đổi tên ứng dụng thành **Prodaily** và áp dụng biểu tượng Logo ProDaily đỏ đen cao cấp trên màn hình chính Android.
            - 🔊 **Âm thanh Video:** Đã mở âm thanh hoạt ảnh skin 1080p, bổ sung nút bật/tắt tiếng (🔊/🔇) tiện lợi và cấp quyền phát âm thanh trực tiếp trên Android WebView.
            - 🎬 **Sửa lỗi chọn cấp Skin:** Khắc phục triệt để lỗi chọn cấp (Level 1, 2, 3, 4) bị đổi thành ảnh ở trang Shop; chuyển đổi mượt mà và phát đúng video từng cấp.
            - 🔍 **Tra cứu Skin chuẩn xác:** Tìm kiếm skin tiếng Việt có dấu và không dấu cực nhanh, hiển thị chuẩn xác hình ảnh, phân cấp, giá VP và video.
            - 🔔 **Thông Báo Đẩy Thật (Real Local Push):** Cấp quyền thông báo Android thật, báo ngay khi skin bạn hẹn xuất hiện trong Cửa hàng hoặc Chợ Đêm (kèm nút thử nghiệm trong Cài Đặt).
            - ⚡ **Peek Tướng & Khóa Tướng Trực Tiếp (Live Match):** Tự động phát hiện trận đấu theo thời gian thực khi tài khoản online. Khi có trận, app tự rung, gửi thông báo đẩy thật và hiện màn hình Peek Tướng với đầy đủ bản đồ, đội hình 5 người, cho phép chọn/khóa tướng tức thì hoặc tự động instalock theo tướng ưu tiên!

            👤 Tác giả: **merrthereboy**  
            💬 Cộng đồng Discord: https://discord.com/invite/z4jUC4v8W2
          files: Prodaily-v1.0.2.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
